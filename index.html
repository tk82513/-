<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3f7773">
<title>DH2 工程缺失管理</title>
<style>
:root{--bg:#f3f5f6;--card:#fff;--ink:#17191b;--muted:#7b8185;--brand:#3f7773;--red:#c34d3b;--amber:#c38a32;--green:#4f8a68;--line:#e4e7e8}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:rgba(243,245,246,.94);backdrop-filter:blur(12px);padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:23px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:3px}
main{max-width:760px;margin:auto;padding:8px 16px 150px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.stats{display:grid;grid-template-columns:110px 1fr;gap:18px;align-items:center}
.ring{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--brand) 0deg,#e2e6e7 0);font-size:20px;font-weight:700}
.ring span{background:white;width:76px;height:76px;border-radius:50%;display:grid;place-items:center}
.location{font-size:15px;color:var(--muted)} .big{font-size:28px;font-weight:700;margin:2px 0 8px}
.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:8px 12px;border-radius:999px;font-size:13px;background:#eef1f1}.pill.red{background:#fae9e6;color:#a33d30}.pill.amber{background:#fbf2df;color:#986a22}.pill.green{background:#e6f2ea;color:#3f7656}
.section-title{font-weight:700;font-size:18px;margin:22px 4px 8px}
.item{background:white;border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:start}
.num{width:40px;height:40px;border-radius:50%;background:var(--brand);color:white;display:grid;place-items:center;font-weight:700}
.item h3{margin:0 0 8px;font-size:17px}.meta{font-size:13px;color:var(--muted);line-height:1.65}.photo-count{font-size:12px;color:var(--muted);white-space:nowrap}
button{border:0;border-radius:14px;padding:12px 15px;font-weight:650;background:var(--brand);color:white;font-size:14px}button.secondary{background:#e9eeee;color:#285d59}button.danger{background:#f8e5e2;color:#a33d30}
.fab{position:fixed;right:22px;bottom:22px;width:60px;height:60px;border-radius:50%;font-size:32px;padding:0;box-shadow:0 8px 24px rgba(0,0,0,.18)}
input,select,textarea{width:100%;border:1px solid #dfe3e4;border-radius:13px;padding:12px;font:inherit;background:white}
label{font-size:13px;color:#666;display:block;margin:12px 0 6px}
.toolbar{display:flex;gap:8px;margin:10px 0}.toolbar>*{flex:1}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.photo-wrap{position:relative}
.photo-grid img{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;display:block}
.photo-delete{position:absolute;right:5px;top:5px;width:30px;height:30px;border-radius:50%;padding:0;background:rgba(0,0,0,.72);color:#fff;font-size:18px;display:grid;place-items:center;border:2px solid #fff;z-index:2}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end}.sheet{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 20px calc(110px + env(safe-area-inset-bottom))}.row{display:flex;gap:10px}.row>*{flex:1}.actions{display:flex;gap:8px;margin-top:16px;position:sticky;bottom:10px;z-index:30;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}.actions>*{flex:1}
.empty{padding:30px;text-align:center;color:var(--muted)}
.page{display:none}.page.active{display:block}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;padding:8px 14px calc(8px + env(safe-area-inset-bottom))}
.bottom-nav button{background:transparent;color:var(--muted);padding:8px;font-size:13px}
.bottom-nav button.active{color:var(--brand);font-weight:800}
.project-back{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.project-back button{background:#e9eeee;color:#285d59}
small.warn{color:var(--red);font-weight:700}

#printReport{display:none}
@media print{
  body{background:#fff}
  header,main,.fab,.modal{display:none!important}
  #printReport{display:block!important;background:#fff;color:#000;padding:12mm;font-size:12px}
  #printReport h1{font-size:22px;margin:0 0 6px}
  #printReport h2{font-size:16px;margin:18px 0 8px;border-bottom:1px solid #aaa;padding-bottom:4px}
  .r-table{width:100%;border-collapse:collapse;margin-top:8px}
  .r-table th,.r-table td{border:1px solid #999;padding:6px;vertical-align:top}
  .r-photo{width:120px;height:90px;object-fit:cover;margin:3px;border:1px solid #ccc}
  @page{size:A4;margin:10mm}
}

#list .item{padding:14px;gap:12px;min-height:auto}
#list .item h3{margin:0 0 7px;font-size:17px;line-height:1.28}
#list .item .meta{font-size:13px;line-height:1.55}
#list .num{width:42px;height:42px;min-width:42px;font-size:18px}
.overdue-badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:#fde7e5;color:#b42318;font-weight:800;font-size:12px;margin-left:5px}
.photo-count{font-size:12px;color:var(--muted);white-space:nowrap}
.fab{width:auto;min-width:58px;padding:0 17px;border-radius:29px;font-weight:800}
.fab::after{content:' 新增缺失';font-size:14px}

.project-item{width:100%;border:1px solid var(--line);background:#fff;color:inherit;text-align:left}
.project-item:active{transform:scale(.995);background:#f8fbfa}
</style>
</head>
<body>
<header>
<div>
  <h1 id="pageTitle">我的工程</h1>
  <div class="sub" id="pageSubtitle">多專案工程缺失管理</div>
</div>
<button class="secondary" id="headerAction" onclick="openProject()">＋ 新增工程</button>
</header>
<main>
<div id="projectsPage" class="page active">
<section class="card">
  <b>🏗️ 我的工程</b>
  <div class="sub">每個案場都有獨立的缺失、照片、廠商與改善紀錄。</div>
  <div id="projects"></div>
</section>
</div>

<div id="detailPage" class="page">
  <div class="project-back">
    <button onclick="showProjectsPage()">‹ 返回工程</button>
  </div>


<section class="card" id="projectPanel">
  <div class="stats">
    <div class="ring" id="ring"><span id="pct">0%</span></div>
    <div><div class="location" id="location">請先建立工程</div><div class="big" id="total">0 <small style="font-size:14px;font-weight:500">總缺失數</small></div>
    <div class="pills"><span class="pill red" id="pending">🔴 0 待處理</span><span class="pill amber" id="doing">🟠 0 進行中</span><span class="pill green" id="closed">🟢 0 已關閉</span></div></div>
  </div>
</section>

<section class="card">
  <b>缺失報告</b>
  <div class="sub">將目前工程的缺失、照片、狀態與品牌資訊整理成 PDF 報告。</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
<button onclick="generatePDF()">產生 PDF 報表</button>
<button class="secondary" onclick="copyOpenDefects()">📋 一鍵複製未改善缺失</button>
</div>
</section>

<div class="toolbar">
<input id="search" placeholder="🔎 搜尋缺失" oninput="renderDefects()">
<select id="filter" onchange="renderDefects()"><option value="all">全部狀態</option><option value="pending">待處理</option><option value="doing">進行中</option><option value="closed">已關閉</option></select>
<select id="categoryFilter" onchange="renderDefects()">
<option value="all">全部分類</option>
<option value="電氣">電氣</option>
<option value="弱電">弱電</option>
<option value="給水">給水</option>
<option value="排水">排水</option>
<option value="消防">消防</option>
<option value="空調">空調</option>
<option value="建築">建築</option>
<option value="其他">其他</option>
</select>
</div>

<div class="section-title">缺失</div>
<div id="list"></div>

</div>
</main>

<nav class="bottom-nav">
  <button id="navProjects" class="active" onclick="showProjectsPage()">🏗️<br>工程</button>
  <button id="navDefects" onclick="showDetailPage()">📋<br>缺失</button>
</nav>
<button class="fab" onclick="openDefect()">＋</button>

<div class="modal" id="modal"><div class="sheet">
<h2 id="modalTitle">新增缺失</h2>
<div id="form">
<label>缺失名稱</label><input id="fTitle" placeholder="例如：B2F 管路墩座裂痕">
<div class="row"><div><label>樓層 / 區域</label><input id="fArea" placeholder="B2F"></div><div><label>嚴重程度</label><select id="fLevel"><option>低</option><option selected>中</option><option>高</option></select></div></div>
<label>標籤分類</label>
<select id="fCategory">
<option value="電氣">電氣</option>
<option value="弱電">弱電</option>
<option value="給水">給水</option>
<option value="排水">排水</option>
<option value="消防">消防</option>
<option value="空調">空調</option>
<option value="建築">建築</option>
<option value="其他" selected>其他</option>
</select>
<div class="row"><div><label>負責廠商</label><input id="fVendor" placeholder="例如：XX水電"></div><div><label>起單日期</label><input id="fCreated" type="date"></div></div><div><label>改善期限</label><input id="fDue" type="date"></div>
<label>缺失說明</label><textarea id="fDesc" rows="3" placeholder="描述問題、位置、要求改善方式"></textarea>
<label>缺失相片（可多張）</label><div class="sub">可從相簿選擇；右上角 × 可刪除。</div>
<input id="fPhotos" type="file" accept="image/*" multiple>
<div id="preview" class="photo-grid"></div>
<label style="margin-top:18px">改善相片（可多張）</label><div class="sub">改善完成後可上傳照片；右上角 × 可刪除。</div>
<input id="fImprovePhotos" type="file" accept="image/*" multiple>
<div id="improvePreview" class="photo-grid"></div>
<div class="actions"><button class="secondary" onclick="closeModal()">取消</button><button onclick="saveDefect()">儲存缺失</button></div>
</div>
</div></div>

<div class="modal" id="projectModal"><div class="sheet">
<h2 id="projectModalTitle">新增工程</h2>
<label>工程名稱</label><input id="pName" placeholder="例如：DH2">
<label>工程案號</label><input id="pNo" placeholder="例如：DH2-2026">
<label>工程地址</label><input id="pAddress" placeholder="例如：台南市永康區水漾路">
<div class="row"><div><label>業主 / 建設公司</label><input id="pOwner"></div><div><label>營造公司</label><input id="pBuilder"></div></div>
<div class="row"><div><label>開工日期</label><input id="pStart" type="date"></div><div><label>預計完工</label><input id="pEnd" type="date"></div></div>
<div class="actions"><button class="secondary" onclick="closeProject()">取消</button><button onclick="saveProject()">建立工程</button></div>
</div></div>

<div class="modal" id="detailModal"><div class="sheet">
<h2 id="dTitle"></h2><div id="dBody"></div>
<div class="actions"><button class="secondary" onclick="closeDetail()">關閉</button><button onclick="cycleStatus()">更新狀態</button></div>
</div></div>

<script>
window.addEventListener('error', function(e){
  console.error(e.error || e.message);
});

const $ = id => document.getElementById(id);
const modal = $('modal');
const detailModal = $('detailModal');
const preview = $('preview');
const improvePreview = $('improvePreview');
const fPhotos = $('fPhotos');
const fImprovePhotos = $('fImprovePhotos');
const fTitle = $('fTitle');
const fArea = $('fArea');
const fVendor = $('fVendor');
const fCreated = $('fCreated');
const fDue = $('fDue');
const fDesc = $('fDesc');
const fLevel = $('fLevel');
const fCategory = $('fCategory');
const dTitle = $('dTitle');
const dBody = $('dBody');

const KEY='dh2_multi_project_v2';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{
 current:'dh2',
 projects:[
  {id:'dh2',name:'DH2',no:'DH2-2026',address:'台南市永康區水漾路',owner:'',builder:'',start:'',end:'',
   defects:[
    {id:1,title:'B2F 管路墩座裂痕',area:'B2F',level:'中',status:'pending',vendor:'水電工程',due:'2026-09-15',desc:'管路墩座發現裂痕，請確認結構及修補方式。',photos:[]},
    {id:2,title:'1F 店鋪捲門衝突器具',area:'1F',level:'中',status:'doing',vendor:'機電工程',due:'2026-09-18',desc:'捲門與現場器具干涉，請調整。',photos:[]},
    {id:3,title:'1F 店鋪捲門衝突器具（待營業部確認）',area:'1F',level:'中',status:'pending',vendor:'裝修工程',due:'2026-09-20',desc:'待營業部確認最終配置。',photos:[]}
   ]},
  {id:'demo2',name:'DH1',no:'DH1-2026',address:'台南市○○區○○路',owner:'',builder:'',start:'',end:'',defects:[]}
 ]};
let currentId=null, editId=null, tempPhotos=[], tempImprovePhotos=[];
function normalizeDates(){
  const today=localToday();
  state.projects.forEach(p=>p.defects.forEach(d=>{if(!d.created)d.created=today;}));
  save();
}

const statusText={pending:'待處理',doing:'進行中',closed:'已關閉'};
function project(){return state.projects.find(p=>p.id===state.current)||state.projects[0]}
function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
    return true;
  }catch(e){
    alert('資料儲存失敗。照片容量可能過大，請刪除部分照片後再試一次。');
    return false;
  }
}
function renderProjects(){
 const el=document.getElementById('projects');
 el.innerHTML=state.projects.map(p=>{
   const done=p.defects.filter(x=>x.status==='closed').length;
   return `<button type="button" class="item project-item" onclick="selectProjectByIndex(${state.projects.indexOf(p)})"><div class="num">🏗️</div><div style="text-align:left;flex:1"><h3>${esc(p.name)}</h3><div class="meta">${esc(p.address||'尚未設定地址')}<br>缺失 ${p.defects.length} 項　完成 ${done} 項</div></div><div>›</div></button>`;
 }).join('') + `<button style="width:100%;margin-top:8px" onclick="openProject()">＋ 新增其他工程</button>`;
}
function renderDefects(){
 const p=project(); if(!p)return;
 const q=document.getElementById('search').value.toLowerCase();
 const f=document.getElementById('filter').value;
 const cf=document.getElementById('categoryFilter').value;
 const rows=p.defects.filter(x=>{
   const hit=(x.title+' '+x.vendor+' '+(x.category||'其他')+' '+(x.desc||'')).toLowerCase().includes(q);
   return hit&&(f==='all'||x.status===f)&&(cf==='all'||(x.category||'其他')===cf);
 });
 const list=document.getElementById('list');
 if(!rows.length){list.innerHTML='<div class="empty">目前沒有符合條件的缺失</div>';return;}
 const today=localToday();
 list.innerHTML=rows.map((x,i)=>{
   const photos=(x.defectPhotos||x.photos||[]).length+(x.improvementPhotos||[]).length;
   const overdue=x.status!=='closed'&&x.due&&x.due<today;
   let overdueText='';
   if(overdue){
     const a=new Date(today+'T00:00:00'),b=new Date(x.due+'T00:00:00');
     const days=Math.max(1,Math.floor((a-b)/86400000));
     overdueText=`<span class="overdue-badge">逾期 ${days} 天</span>`;
   }
   const photoText=photos>0?`<span class="photo-count">📷 ${photos}</span>`:'';
   return `<div class="item" onclick="openDetail('${x.id}')">
    <div class="num">${i+1}</div>
    <div style="min-width:0;flex:1">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><h3>${esc(x.title)}</h3>${photoText}</div>
      <div class="badges"><span class="badge level">${esc(x.level||'中')}</span><span class="badge category">🏷️ ${esc(x.category||'其他')}</span><span class="badge ${x.status}">${statusName(x.status)}</span>${overdueText}</div>
      <div class="meta">${esc(x.vendor||'未指定廠商')}　起單 ${esc(x.created||'-')}　期限 ${esc(x.due||'-')}</div>
    </div>
   </div>`;
 }).join('');
}
function render(){renderProjects();renderDefects()}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function selectProject(id){
  const idx=state.projects.findIndex(p=>String(p.id)===String(id));
  if(idx>=0) selectProjectByIndex(idx);
}
function selectProjectByIndex(idx){
  const p=state.projects[idx];
  if(!p) return;
  state.current=p.id;
  save();
  document.getElementById('search').value='';
  document.getElementById('filter').value='all';
  document.getElementById('categoryFilter').value='all';
  render();
  showDetailPage();
  try{ history.replaceState(null,'','#project='+encodeURIComponent(String(p.id))); }catch(e){}
}


function restoreProjectFromHash(){
  const m=location.hash.match(/^#project=(.+)$/);
  if(!m)return false;
  const id=decodeURIComponent(m[1]);
  const idx=state.projects.findIndex(p=>String(p.id)===String(id));
  if(idx<0)return false;
  state.current=state.projects[idx].id;
  save();
  render();
  showDetailPage();
  return true;
}

function showProjectsPage(){
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  document.getElementById('projectsPage').classList.add('active');
  document.getElementById('detailPage').classList.remove('active');
  document.getElementById('pageTitle').textContent='我的工程';
  document.getElementById('pageSubtitle').textContent='多專案工程缺失管理';
  document.getElementById('headerAction').style.display='';
  const fab=document.querySelector('.fab'); if(fab) fab.style.display='none';
  document.getElementById('navProjects').classList.add('active');
  document.getElementById('navDefects').classList.remove('active');
  renderProjects();
}
function showDetailPage(){
  const p=project();
  if(!p){ showProjectsPage(); return; }
  document.getElementById('projectsPage').classList.remove('active');
  document.getElementById('detailPage').classList.add('active');
  document.getElementById('pageTitle').textContent=p.name;
  document.getElementById('pageSubtitle').textContent='工程缺失管理';
  document.getElementById('headerAction').style.display='none';
  const fab=document.querySelector('.fab'); if(fab) fab.style.display='';
  document.getElementById('navProjects').classList.remove('active');
  document.getElementById('navDefects').classList.add('active');
  document.getElementById('location').textContent='📍 '+(p.address||'尚未設定地址');
  renderDefects();
}

function openProject(){['pName','pNo','pAddress','pOwner','pBuilder','pStart','pEnd'].forEach(x=>document.getElementById(x).value='');document.getElementById('projectModal').style.display='flex'}
function closeProject(){document.getElementById('projectModal').style.display='none'}
function saveProject(){let name=document.getElementById('pName').value.trim();if(!name)return alert('請輸入工程名稱');let p={id:'p'+Date.now(),name,no:document.getElementById('pNo').value,address:document.getElementById('pAddress').value,owner:document.getElementById('pOwner').value,builder:document.getElementById('pBuilder').value,start:document.getElementById('pStart').value,end:document.getElementById('pEnd').value,defects:[]};state.projects.push(p);state.current=p.id;save();closeProject();render();showDetailPage()}
function openDefect(id=null){
  editId=id;
  document.getElementById('modalTitle').textContent=id?'編輯缺失':'新增缺失';
  let x=id?project().defects.find(a=>a.id===id):{};
  tempPhotos=[...(x.defectPhotos||x.photos||[])];
  tempImprovePhotos=[...(x.improvementPhotos||[])];
  fTitle.value=x.title||'';
  fArea.value=x.area||'';
  fVendor.value=x.vendor||'機電工程';
  fCreated.value=x.created||localToday();
  fDue.value=x.due||'';
  fDesc.value=x.desc||'請依照改善期限內修繕完成';
  fLevel.value=x.level||'中';fCategory.value=x.category||'其他';
  fPhotos.value='';
  fImprovePhotos.value='';
  renderPhotoPreview();
  renderImprovePhotoPreview();
  modal.style.display='flex';
}
fPhotos.addEventListener('change',async e=>{
  for(const file of [...e.target.files]){
    const data=await compressImage(file);
    if(data) tempPhotos.push(data);
  }
  renderPhotoPreview();
  e.target.value='';
});
fImprovePhotos.addEventListener('change',async e=>{
  for(const file of [...e.target.files]){
    const data=await compressImage(file);
    if(data) tempImprovePhotos.push(data);
  }
  renderImprovePhotoPreview();
  e.target.value='';
});

function localToday(){
  const d=new Date();
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function compressImage(file){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=1280, scale=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',0.72));
      };
      img.onerror=()=>resolve(null);
      img.src=reader.result;
    };
    reader.onerror=()=>resolve(null);
    reader.readAsDataURL(file);
  });
}

function saveDefect(){
  let title=document.getElementById('fTitle').value.trim();
  if(!title){alert('請輸入缺失名稱');return;}
  let p=project();
  let old=editId?p.defects.find(a=>a.id===editId):null;
  let backup=JSON.stringify(p.defects);
  let x={
    id:editId||Date.now(), title, area:fArea.value, level:fLevel.value,
    status:(old&&old.status)||'pending', category:fCategory.value||'其他',
    vendor:fVendor.value.trim()||'機電工程',
    created:fCreated.value||localToday(),
    due:fDue.value,
    desc:fDesc.value.trim()||'請依照改善期限內修繕完成',
    defectPhotos:[...tempPhotos],
    improvementPhotos:[...tempImprovePhotos]
  };
  if(editId) p.defects=p.defects.map(a=>a.id===editId?x:a); else p.defects.push(x);
  if(!save()){
    p.defects=JSON.parse(backup);
    return;
  }
  closeModal();
  render();
  alert(editId?'缺失已更新':'缺失已儲存');
}

async function copyOpenDefects(){
  const p=project();
  const items=p.defects.filter(x=>x.status!=='closed');
  if(!items.length){
    alert('目前沒有未改善缺失。');
    return;
  }
  const today=new Date();
  const lines=[
    `【${p.name} 未改善缺失】`,
    `日期：${today.toLocaleDateString('zh-TW')}`,
    `共 ${items.length} 項`,
    ''
  ];
  items.forEach((x,i)=>{
    const overdue=x.due && new Date(x.due)<today ? ' ⚠️逾期' : '';
    lines.push(
      `${i+1}. ${x.title}`,
      `位置：${x.area||'未填'}`,
      `分類：${x.category||'其他'}`,
      `負責：${x.vendor||'未指派'}`,
      `狀態：${statusText[x.status]||x.status}`,
      `起單：${x.created||'未設定'}`,
      `期限：${x.due||'未設定'}${overdue}`,
      x.desc ? `說明：${x.desc}` : '',
      ''
    );
  });
  const output=lines.filter((v,i,a)=>v!=='' || a[i-1]!=='').join('\n').trim();
  try{
    await navigator.clipboard.writeText(output);
    alert(`已複製 ${items.length} 項未改善缺失，可直接貼到 LINE。`);
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=output;
    ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.focus();ta.select();
    document.execCommand('copy');ta.remove();
    alert(`已複製 ${items.length} 項未改善缺失，可直接貼到 LINE。`);
  }
}

function generatePDF(){
  const p=project();
  const pending=p.defects.filter(x=>x.status==='pending').length;
  const doing=p.defects.filter(x=>x.status==='doing').length;
  const closed=p.defects.filter(x=>x.status==='closed').length;
  const overdue=p.defects.filter(x=>x.due && new Date(x.due)<new Date() && x.status!=='closed').length;
  const rows=p.defects.map((x,i)=>{
    const dphotos=(x.defectPhotos||x.photos||[]).map(ph=>`<img class="r-photo" src="${ph}">`).join('');
    const iphotos=(x.improvementPhotos||[]).map(ph=>`<img class="r-photo" src="${ph}">`).join('');
    const photos=`缺失相片：${dphotos||'無'}<br>改善相片：${iphotos||'無'}`;
    return `<tr>
      <td>${i+1}</td>
      <td>${esc(x.title)}</td>
      <td>${esc(x.area||'')}</td>
      <td>${esc(x.category||'其他')}</td>
      <td>${esc(x.vendor||'')}</td>
      <td>${esc(x.level||'')}</td>
      <td>${esc(statusText[x.status]||x.status)}</td>
      <td>${x.created||''}</td>
      <td>${x.due||''}</td>
      <td>${esc(x.desc||'')}</td>
      <td>${photos||'無'}</td>
    </tr>`;
  }).join('');
  document.getElementById('printReport').innerHTML=`
    <h1>${esc(p.name)} 工程缺失改善管制報表</h1>
    <div>工程案號：${esc(p.no||'')}</div>
    <div>工程地址：${esc(p.address||'')}</div>
    <div>業主／建設公司：${esc(p.owner||'')}</div>
    <div>營造公司：${esc(p.builder||'')}</div>
    <div>報表日期：${new Date().toISOString().slice(0,10)}</div>
    <h2>統計</h2>
    <div>總缺失：${p.defects.length}　待處理：${pending}　進行中：${doing}　已關閉：${closed}　逾期：${overdue}</div>
    <h2>缺失明細</h2>
    <table class="r-table">
      <thead><tr><th>#</th><th>缺失</th><th>位置</th><th>分類</th><th>廠商</th><th>等級</th><th>狀態</th><th>起單日期</th><th>改善期限</th><th>說明</th><th>照片</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  setTimeout(()=>window.print(),300);
}
