<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1716"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="工地相機">
<link rel="manifest" href="manifest-camera.webmanifest"><title>工地相機</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#07100f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;overflow:hidden}#app{height:100%;display:flex;flex-direction:column}.top{padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#0d1716;display:flex;gap:8px;align-items:center}.top select,.top button{height:40px;border:0;border-radius:11px;padding:0 11px;font-weight:800}.top select{flex:1;background:#fff;color:#17201f}.top button{background:#23312f;color:#fff}.view{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}video{width:100%;height:100%;object-fit:cover;background:#000}.msg{position:absolute;left:12px;right:12px;top:12px;padding:9px 12px;border-radius:12px;background:rgba(0,0,0,.55);font-size:12px;text-align:center;backdrop-filter:blur(8px)}.zoom{position:absolute;left:0;right:0;bottom:18px;display:flex;justify-content:center;gap:8px}.zoom button{width:48px;height:36px;border-radius:18px;border:0;background:rgba(0,0,0,.62);color:#fff;font-weight:900}.zoom button.active{background:#fff;color:#111}.bottom{background:#0d1716;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 86px 1fr;align-items:center}.status{font-size:12px;color:#b8c7c4;line-height:1.45}.shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:#e9eeee;box-shadow:inset 0 0 0 5px #0d1716;margin:auto}.count{text-align:right;font-size:12px;color:#b8c7c4}.login{position:fixed;inset:0;z-index:10;background:#e7ebed;color:#17201f;display:none;place-items:center;padding:20px}.login.show{display:grid}.card{width:min(420px,100%);background:#fff;padding:20px;border-radius:20px}.card h2{margin:0 0 6px}.card input,.card button{width:100%;height:46px;margin-top:10px;border-radius:12px;border:1px solid #d8dfdf;padding:0 12px;font:inherit}.card button{border:0;background:#19796e;color:#fff;font-weight:800}.sub{font-size:12px;color:#71807d;line-height:1.5}canvas{display:none}
</style></head><body><div id="app">
<div class="top"><select id="project"><option>讀取工程中…</option></select><button id="switch">鏡頭</button></div>
<div class="view"><video id="video" autoplay playsinline muted></video><div class="msg" id="msg">正在啟動後鏡頭…</div><div class="zoom" id="zoom"></div></div>
<div class="bottom"><div class="status" id="status">☁️ 準備中</div><button class="shutter" id="shutter" aria-label="拍照"></button><div class="count" id="count">本次 0 張</div></div></div>
<div class="login" id="login"><div class="card"><h2>📷 工地相機</h2><div class="sub">登入後直接拍照並上傳工程雲端，不寫入 iPhone 相簿。</div><input id="account" autocomplete="username" placeholder="帳號"><input id="password" type="password" autocomplete="current-password" placeholder="密碼"><button id="loginBtn">登入</button><div class="sub" id="loginMsg"></div></div></div>
<canvas id="canvas"></canvas>
<script>
const URL='https://gtfqhcmdikygnusvftxy.supabase.co',KEY='sb_publishable_Cs7RfmIw9Wg1pH3H-Lm7BA_Fa_CxH_h';
const db=supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);let stream=null,devices=[],deviceIndex=0,shotCount=0,busy=false;
function setMsg(t,hide=false){$('msg').textContent=t;$('msg').style.display=hide?'none':'block'}
async function auth(){const {data:{session}}=await db.auth.getSession();if(!session){$('login').classList.add('show');return false}$('login').classList.remove('show');return true}
$('loginBtn').onclick=async()=>{let u=$('account').value.trim(),p=$('password').value;if(!u||!p)return;$('loginMsg').textContent='登入中…';if(!u.includes('@'))u=u.replace(/[^a-zA-Z0-9._-]/g,'_')+'@dh2.local';const {error}=await db.auth.signInWithPassword({email:u,password:p});if(error){$('loginMsg').textContent='登入失敗：'+error.message;return}$('login').classList.remove('show');await init()};
async function loadProjects(){const {data,error}=await db.from('projects').select('id,name,no').order('created_at');if(error)throw error;const sel=$('project');sel.innerHTML=(data||[]).map(p=>`<option value="${p.id}">${p.name||p.no||'工程'}</option>`).join('');const last=localStorage.getItem('site_camera_project');if(last&&[...sel.options].some(o=>o.value===last))sel.value=last;sel.onchange=()=>localStorage.setItem('site_camera_project',sel.value)}
async function startCamera(deviceId=null){if(stream)stream.getTracks().forEach(t=>t.stop());const c={audio:false,video:deviceId?{deviceId:{exact:deviceId}}:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}};try{stream=await navigator.mediaDevices.getUserMedia(c);$('video').srcObject=stream;await $('video').play();await discover();renderZoom();setMsg('後鏡頭已啟動',false);setTimeout(()=>setMsg('',true),1200)}catch(e){setMsg('無法開啟相機：'+e.message)}}
async function discover(){const all=await navigator.mediaDevices.enumerateDevices();devices=all.filter(d=>d.kind==='videoinput');const track=stream?.getVideoTracks?.()[0],sid=track?.getSettings?.().deviceId;const i=devices.findIndex(d=>d.deviceId===sid);if(i>=0)deviceIndex=i}
function renderZoom(){const z=$('zoom');z.innerHTML='';const track=stream?.getVideoTracks?.()[0];if(!track)return;const caps=track.getCapabilities?.()||{},settings=track.getSettings?.()||{};if(caps.zoom){[0.5,1,2,3].filter(v=>v>=caps.zoom.min&&v<=caps.zoom.max).forEach(v=>{const b=document.createElement('button');b.textContent=v+'×';b.onclick=()=>applyZoom(v,b);if(Math.abs((settings.zoom||1)-v)<.1)b.className='active';z.appendChild(b)})}else if(devices.length>1){devices.forEach((d,i)=>{const label=(d.label||'').toLowerCase();if(!/front|前/.test(label)){const b=document.createElement('button');b.textContent=/ultra|超廣|back dual wide/.test(label)?'0.5×':(i===deviceIndex?'1×':'鏡頭');b.onclick=()=>startCamera(d.deviceId);z.appendChild(b)}})}}
async function applyZoom(v,b){const t=stream?.getVideoTracks?.()[0];try{await t.applyConstraints({advanced:[{zoom:v}]});document.querySelectorAll('.zoom button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}catch(e){setMsg('此鏡頭不支援 '+v+'×')}}
$('switch').onclick=async()=>{if(!devices.length)await discover();if(devices.length<2)return;deviceIndex=(deviceIndex+1)%devices.length;await startCamera(devices[deviceIndex].deviceId)};
function blobFromCanvas(){return new Promise(r=>$('canvas').toBlob(r,'image/jpeg',.82))}
$('shutter').onclick=async()=>{if(busy||!stream||!$('project').value)return;busy=true;$('shutter').style.opacity=.5;try{const v=$('video'),c=$('canvas'),max=1800,scale=Math.min(1,max/Math.max(v.videoWidth,v.videoHeight));c.width=Math.round(v.videoWidth*scale);c.height=Math.round(v.videoHeight*scale);c.getContext('2d').drawImage(v,0,0,c.width,c.height);const blob=await blobFromCanvas();const pid=$('project').value,now=new Date(),day=now.toISOString().slice(0,10),name=`${Date.now()}_${crypto.randomUUID?.()||Math.random().toString(36).slice(2)}.jpg`,path=`${pid}/site-camera/${day}/${name}`;$('status').textContent='☁️ 上傳中…';const {error}=await db.storage.from('defect-photos').upload(path,blob,{contentType:'image/jpeg',upsert:false});if(error)throw error;shotCount++;$('count').textContent=`本次 ${shotCount} 張`;$('status').textContent='✅ 已上傳 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});if(navigator.vibrate)navigator.vibrate(30)}catch(e){$('status').textContent='❌ 上傳失敗';setMsg('照片未上傳：'+e.message)}finally{busy=false;$('shutter').style.opacity=1}};
async function init(){if(!await auth())return;try{await loadProjects();await startCamera()}catch(e){setMsg('初始化失敗：'+e.message)}}
init();
</script></body></html>
